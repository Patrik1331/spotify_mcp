[project]
name = "spotify-mcp"
version = "0.1.0"
description = "MCP server for Spotify Web API — control Spotify from Claude Code"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "Patrik Karabinos"}
]
dependencies = [
    "mcp>=2.0.0,<3.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.0",
    "pyright>=1.1.400",
]

[project.scripts]
spotify-mcp = "spotify_mcp.server:main"
spotify-mcp-auth = "spotify_mcp.auth:run_auth_flow"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spotify_mcp"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
