[project]
name = "spotify-mcp"
version = "0.1.0"
description = "MCP server for Spotify Web API — control Spotify from Claude Code"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "Patrik Karabinos"}
]
dependencies = [
    # mcp 2.x removed mcp.server.fastmcp (renamed to mcp.server.mcpserver) — pin to 1.x
    # until app.py is migrated to the 2.x API.
    "mcp>=1.0.0,<2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
spotify-mcp = "spotify_mcp.server:main"
spotify-mcp-auth = "spotify_mcp.auth:run_auth_flow"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spotify_mcp"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
